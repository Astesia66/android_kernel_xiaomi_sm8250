name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code'
        required: false
        default: 'alioth'
      ksu:
        description: 'Enable KernelSU (true/false)'
        required: false
        default: 'true'
      target_os:
        description: 'Target OS (aosp/miui/both)'
        required: false
        default: 'aosp'
      droidspaces:
        description: 'Enable DroidSpaces (true/false)'
        required: false
        default: 'false'
  push:
    branches:
      - 'seventeen-sukisu-susfs'
    paths:
      - 'build_kernel.sh'
      - 'anykernel_template.sh'
      - 'scripts/**'
      - 'arch/arm64/configs/**'
      - 'fs/**'
      - 'include/**'
      - 'kernel/**'
      - 'drivers/**'
      - 'net/**'
      - 'security/**'
      - '.github/workflows/build.yml'
      - '.trigger_ci'

jobs:
  build-kernel:
    name: "Build Pure Kernel (alioth)"
    # 🚨 核心修改 1：锁定使用 Ubuntu 22.04，完美避开 26.04 没有 libxml2 的坑
    runs-on: ubuntu-22.04
    
    steps:
    - name: "Checkout Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: "Set up Environment"
      run: |
        sudo apt-get update
        # 🚨 核心修改 2：正常安装 libxml2-dev 和 libxml2，让 lld 链接器正常工作
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex gawk git gnupg \
          libelf-dev libncurses-dev libssl-dev lzop python3 rsync zip zlib1g-dev \
          libxml2-dev libxml2

    - name: "Cache ccache"
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-pure-kernel-ccache-alioth-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-pure-kernel-ccache-alioth-
          ${{ runner.os }}-pure-kernel-ccache-

    - name: "Cache zyc-clang 16 Toolchain"
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ~/zyc-clang
        key: zyc-clang-16.0.6-20260807

    - name: "Setup zyc-clang 16 Toolchain"
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxf Clang-16.0.6-20260807.tar.gz
        rm -f Clang-16.0.6-20260807.tar.gz

    - name: "Configure ccache"
      run: |
        ccache -M 5G
        ccache -z

    - name: "Run Build Script"
      run: |
        sed -i 's/\r$//' build_kernel.sh
        chmod +x build_kernel.sh
        
        # 🚨 核心修改 3：去掉了所有 sed 暴力破解代码，让脚本根据真实的编译结果说话
        
        DEV="${{ github.event.inputs.device }}"
        [ -z "$DEV" ] && DEV="alioth"
        
        KSU_FLAG="${{ github.event.inputs.ksu }}"
        [ -z "$KSU_FLAG" ] && KSU_FLAG="true"
        
        OS_FLAG="${{ github.event.inputs.target_os }}"
        [ -z "$OS_FLAG" ] && OS_FLAG="aosp"
        
        DS_FLAG="${{ github.event.inputs.droidspaces }}"
        [ -z "$DS_FLAG" ] && DS_FLAG="false"
        
        ARGS="$DEV"
        if [ "$KSU_FLAG" = "true" ]; then ARGS="$ARGS ksu"; fi
        ARGS="$ARGS $OS_FLAG"
        if [ "$DS_FLAG" = "true" ]; then ARGS="$ARGS droidspaces"; fi
        
        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: "Post-Flight: Validate Compiled Kernel Image (ISO/IEC 29119)"
      run: |
        # 去掉了 || true，让测试正常执行。因为环境修好了，ThinLTO 正常开启，测试自然会通过
        if [ -f "out_aosp/arch/arm64/boot/Image" ]; then
          python3 scripts/test_kernel_compatibility.py --validate-image out_aosp/arch/arm64/boot/Image
        fi
        if [ -f "out_miui/arch/arm64/boot/Image" ]; then
          python3 scripts/test_kernel_compatibility.py --validate-image out_miui/arch/arm64/boot/Image
        fi

    - name: "Upload Pure Flashable ZIP & SHA256SUMS"
      uses: actions/upload-artifact@v4
      with:
        name: APTKernel-Pure-alioth-aosp-${{ github.run_id }}
        path: |
          APTKernel_Pure_*.zip
        compression-level: 0
        
      
